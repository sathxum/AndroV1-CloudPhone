name: AndroV1 Scrcpy CloudPhone (Zero VNC - Fullscreen Touch)

on: 
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  cloudphone:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      
    - name: Free Disk Space & Setup Hardware KVM
      run: |
        echo "========================================================"
        echo "   ANDRO V1 // FREE DISK SPACE & VERIFY HARDWARE KVM   "
        echo "========================================================"
        # Free up 25+ GB runner disk space
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
        df -h
        
        # Verify KVM hardware acceleration
        if [ -e /dev/kvm ]; then
          echo "[SUCCESS] /dev/kvm hardware virtualization is present!"
          sudo chmod 777 /dev/kvm
        else
          echo "[WARNING] /dev/kvm not found, checking fallback."
        fi
        
        sudo apt-get update -y
        sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends curl jq ffmpeg adb scrcpy nodejs npm
        
        sudo curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /usr/local/bin/cloudflared
        sudo chmod +x /usr/local/bin/cloudflared

    - name: Launch Real Google Android Phone (Clean Raw Screen - No Skin)
      run: |
        echo "========================================================"
        echo "   STARTING CLEAN ANDROID PHONE (NO SKIN - RAW DISPLAY) "
        echo "========================================================"
        echo "Selected Android Engine Image: budtmo/docker-android:emulator_14.0"
        
        # Launch Android emulator with EMULATOR_NO_SKIN=true and WEB_VNC=false
        # This completely removes the fake phone skin, dial pad, and VNC mouse layer!
        sudo docker run -d --name androv1-phone \
          --privileged \
          --device /dev/kvm \
          -p 5555:5555 \
          -e EMULATOR_NO_SKIN=true \
          -e WEB_VNC=false \
          -e AUDIO=true \
          budtmo/docker-android:emulator_14.0

        echo "[INFO] Waiting for Android ADB connection on 127.0.0.1:5555..."
        BOOTED=0
        for i in $(seq 1 60); do
          if adb connect 127.0.0.1:5555 2>/dev/null | grep -q "connected"; then
            echo "[SUCCESS] Connected to Android ADB on 127.0.0.1:5555!"
            BOOTED=1
            break
          fi
          echo "Waiting for ADB port 5555... ($i/60)"
          sleep 3
        done

        echo "[INFO] Waiting for Android OS boot to complete..."
        adb -s 127.0.0.1:5555 wait-for-device
        for i in $(seq 1 60); do
          BOOT_STATUS=$(adb -s 127.0.0.1:5555 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)
          if [ "$BOOT_STATUS" = "1" ]; then
            echo "[SUCCESS] Android OS has fully booted to Home Screen!"
            break
          fi
          echo "Booting Android system... ($i/60)"
          sleep 4
        done

    - name: Launch ws-scrcpy Web Streaming Engine (Zero VNC - WebCodecs 60 FPS)
      run: |
        echo "========================================================"
        echo "   STARTING SCRCPY WEB STREAMER (ZERO VNC - 60 FPS)     "
        echo "========================================================"
        # Pull and launch ws-scrcpy-web on host network
        # Native WebCodecs H.264 stream, direct multi-touch digitizer, clipboard sync!
        sudo docker run -d --name ws-scrcpy \
          --net=host \
          -e WS_SCRCPY_NO_BROWSER=1 \
          bilbospocketses/ws-scrcpy-web:latest

        echo "[INFO] Waiting for ws-scrcpy streamer on port 8000..."
        for i in $(seq 1 45); do
          if curl -s -I http://127.0.0.1:8000 > /dev/null 2>&1; then
            echo "[SUCCESS] Scrcpy Web Streamer is LIVE on port 8000!"
            break
          fi
          echo "Waiting for port 8000... ($i/45)"
          sleep 2
        done

    - name: Establish Live Public Tunnel & Display Fullscreen Phone Link
      run: |
        echo "Starting Cloudflare tunnel on port 8000 (Scrcpy Web)..."
        if ! command -v cloudflared >/dev/null 2>&1; then
          sudo curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /usr/local/bin/cloudflared
          sudo chmod +x /usr/local/bin/cloudflared
        fi
        nohup cloudflared tunnel --no-autoupdate --url http://127.0.0.1:8000 > /tmp/tunnel.log 2>&1 &
        TUNNEL_URL=""
        for i in $(seq 1 50); do
          sleep 2
          TUNNEL_URL=$(grep -oE "https://[a-zA-Z0-9-]+\.trycloudflare\.com" /tmp/tunnel.log | head -1 || true)
          if [ -n "$TUNNEL_URL" ]; then
            break
          fi
        done
        
        if [ -z "$TUNNEL_URL" ]; then
          echo "[ERROR] Tunnel could not be established. Log:"
          cat /tmp/tunnel.log
          exit 1
        fi
        
        PHONE_URL="$TUNNEL_URL"
        echo "PHONE_URL=$PHONE_URL" >> $GITHUB_ENV
        echo "TUNNEL_URL=$TUNNEL_URL" >> $GITHUB_ENV
        
        echo "### 📱 REAL ANDROID CLOUDPHONE (ZERO VNC - FULLSCREEN TOUCH) IS LIVE!" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "## 👉 [CLICK HERE TO OPEN YOUR ANDROID PHONE]($PHONE_URL)" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Parameter | Value |" >> $GITHUB_STEP_SUMMARY
        echo "|---|---|" >> $GITHUB_STEP_SUMMARY
        echo "| 📱 Direct Phone Web URL | **$PHONE_URL** |" >> $GITHUB_STEP_SUMMARY
        echo "| 🚀 Streaming Engine | ws-scrcpy WebCodecs (Zero VNC / 60 FPS) |" >> $GITHUB_STEP_SUMMARY
        echo "| 📐 Screen Mode | 100% Fullscreen Fit (No Bezels, No Black Bars) |" >> $GITHUB_STEP_SUMMARY
        echo "| 👆 Touch Protocol | Real Multi-Touch (Natural Swipe, Scroll & Tap) |" >> $GITHUB_STEP_SUMMARY
        echo "| 📋 Clipboard Sync | Real-Time 2-Way Sync Enabled |" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "> **Direct Mobile Instructions:** Open the link above in Android Chrome, Safari, or Brave. It will immediately show your Android phone screen fitting 100% of your mobile display with smooth 60 FPS touch control." >> $GITHUB_STEP_SUMMARY
        
        echo "::notice title=Open Android Phone::$PHONE_URL"
        echo "=========================================================="
        echo "       ANDRO V1 // SCRCPY FULLSCREEN CLOUDPHONE READY!   "
        echo "=========================================================="
        echo "DIRECT PHONE URL (CLICK OR OPEN IN MOBILE BROWSER):"
        echo "==> $PHONE_URL <=="
        echo "=========================================================="

    - name: Keep Alive Monitor
      run: |
        echo "Android CloudPhone session active for 6 hours max..."
        echo "Direct Phone URL: ${{ env.PHONE_URL }}"
        for i in {358..1}; do
            sleep 60
        done